[project]
name = "pre-pickleball"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["backend", "."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend"]

[tool.ruff.lint]
# Incremental CI gate: block unused imports and locals first. The previous broad
# profile had a 545-error baseline, dominated by E501; keep 120 columns configured
# and expand the selected rules as that backlog is reduced.
select = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入的标准写法：Depends()/File() 必须在默认参数中求值
"backend/app/api/*.py" = ["B008"]
"backend/app/api/**/*.py" = ["B008"]
# 包 docstring 含长中文说明行，不参与行宽约束
"backend/**/__init__.py" = ["E501"]
