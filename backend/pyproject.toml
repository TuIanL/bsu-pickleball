[project]
name = "pre-pickleball-backend"
version = "0.1.0"
description = "Lightweight backend foundation for pickleball visual analysis."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
vision = [
  "opencv-python>=4.10.0",
]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
