[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "resources/*.json",
  "vision/target_subject_provider/contract_data/v1/*.json",
  "vision/target_subject_provider/contract_data/v1/schemas/*.json",
  "vision/target_subject_provider/contract_data/v1/fixtures/*.json",
]

[project]
name = "pre-pickleball-backend"
version = "0.1.0"
description = "Lightweight backend foundation for pickleball visual analysis."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=1.26.0,<2.0",
  "scipy>=1.11.0",
  "opencv-python>=4.10.0,<4.13.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "jsonschema>=4.23.0,<5.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "uvicorn[standard]>=0.30.0",
  "psutil>=5.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
vision = [
  "ultralytics>=8.3.0",
]
pose = [
  "openmim>=0.3.9",
  "mmpose>=1.3.0",
  "mmdet>=3.0.0,<3.4.0",
  "mmcv>=2.0.1,<2.2.0",
  "mmengine>=0.10.0",
  "torch>=2.1.0",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "build>=1.2.2,<2.0",
  "setuptools>=69",
  "wheel>=0.44,<1.0",
  "psutil>=5.9",
]

[project.scripts]
target-subject-provider = "app.vision.target_subject_provider.cli:main"

[tool.pytest.ini_options]
pythonpath = [".", ".."]
