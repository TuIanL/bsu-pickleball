[project]
name = "pre-pickleball-backend"
version = "0.1.0"
description = "Lightweight backend foundation for pickleball visual analysis."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=1.26.0",
  "opencv-python>=4.10.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
vision = [
  "ultralytics>=8.3.0",
]
pose = [
  "openmim>=0.3.9",
  "mmpose>=1.3.0",
  "mmengine>=0.10.0",
  "torch>=2.1.0",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
