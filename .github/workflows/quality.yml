name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.11
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-py311.lock
          python -m pip install --no-deps -e 'backend[dev]'
      # 拆成独立 step：合并成一个 run 时，首个失败会掩盖后续门禁，也无法从
      # 页面直接看出是 build / test / lint 哪一步挂了。
      - name: Frontend build
        run: npm run build
      - name: Frontend tests
        run: npm test -- --pool=threads --maxWorkers=2
      - name: Frontend lint
        run: npm run lint
      - name: Backend tests
        working-directory: backend
        run: |
          # Actions 的 run 默认是 bash -e，必须关掉，否则 pytest 一失败就直接跳出，
          # 下面的诊断代码永远执行不到。
          set +e
          python -m pytest -q \
            --ignore=tests/test_hybrid_ball_regression_fixture.py \
            --ignore=tests/test_sync_recording.py 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 把失败清单与末段输出暴露为注解：无 Actions 日志权限时也能从
            # check-run API 读到具体失败用例
            echo "::error::pytest 退出码 $status，失败清单："
            grep -E '^(FAILED|ERROR)' pytest.log | head -20 | sed 's/^/::error::/'
            echo "::error::末段输出："
            tail -12 pytest.log | sed 's/^/::error::/'
          fi
          exit "$status"

  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.11
      - run: python -m pip install ruff==0.16.1
      - name: Unused imports and locals
        run: ruff check backend/app
      - name: Changed exception policy
        if: always()
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$CHECK_BASE" ] || [ "$CHECK_BASE" = "0000000000000000000000000000000000000000" ]; then
            CHECK_BASE=$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          python backend/scripts/check_exception_policy.py --base "$CHECK_BASE"

  openspec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: npm install --global @fission-ai/openspec@1.2.0
      - name: OpenSpec validation
        run: |
          checked=0
          for change_dir in openspec/changes/*/; do
            [ -f "${change_dir}tasks.md" ] || continue
            openspec validate "$(basename "${change_dir%/}")" --strict
            checked=$((checked + 1))
          done
          if [ "$checked" -eq 0 ]; then
            echo "No active OpenSpec changes; validation explicitly skipped."
          fi
